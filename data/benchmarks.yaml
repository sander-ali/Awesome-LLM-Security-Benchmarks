  - id: 41
    name: "FigStep"
    category: "Multimodal Safety"
    category_slug: "multimodal-safety"
    year: "2025"
    year_sort: 2025
    year_venue_origin: "2025 · AAAI · Yichen Gong et al."
    year_venue_origin_source: "2025 AAAI Yichen Gong et al."
    website:
      label: "github.com/CryptoAILab/FigStep"
      url: "https://github.com/CryptoAILab/FigStep"
    paper:
